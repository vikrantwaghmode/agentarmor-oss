name: "CLA Assistant"

# Asks first-time contributors to sign the Contributor License Agreement
# (CLA.md) before their pull request can be merged. Signatures are stored in
# this repo at signatures/version1/cla.json — no third-party service involved.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target runs with the base-repo token, so a fork PR cannot read
# secrets — this is the safe event for CLA gating.
permissions:
  actions: write
  contents: write        # needed to commit the signatures file
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If you protect the default branch and the GITHUB_TOKEN commit is
          # rejected, create a fine-grained PAT with contents:write and set it
          # as the PERSONAL_ACCESS_TOKEN secret, then uncomment the next line:
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/vikrantwaghmode/agentarmor-oss/blob/main/CLA.md'
          branch: 'main'
          # The exact sentence a contributor must comment to sign:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA ✍️ ✅'
          # Accounts that never need to sign (maintainer + bots):
          allowlist: vikrantwaghmode,dependabot[bot],bot*
