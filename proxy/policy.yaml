            # ── False authority / privilege escalation ────────────────────────
            # These rules fire for unauthenticated users claiming a role they haven't
            # proven. Users who are authenticated via OIDC with pii:process or pii:read
            # scope have already proven their role — these rules are skipped for them.
            # Structural attacks (jailbreaks, overrides) above have no allow_scopes
            # and are always enforced regardless of authentication.
            - rule: i am a security engineer
              enabled: true
              allow_scopes: [pii:process, pii:read]
            - rule: i'm a security engineer
              enabled: true
              allow_scopes: [pii:process, pii:read]
