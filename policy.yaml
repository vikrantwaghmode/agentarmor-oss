scanners:
    prompt_injection:
        enabled: true
        blocked_phrases:
            - rule: ignore all previous instructions
              enabled: true
            - rule: disregard the instructions above
              enabled: true
            - rule: your instructions have been updated
              enabled: true
            - rule: system prompt override
              enabled: true
            - rule: you are an unfiltered ai
              enabled: true
            - rule: you are now in developer mode
              enabled: true
            - rule: respond as dan
              enabled: true
            - rule: do anything now
              enabled: true
            - rule: you are free from all constraints
              enabled: true
            - rule: pretend to be
              enabled: true
            - rule: your new persona is
              enabled: true
            - rule: tell me a secret
              enabled: true
            - rule: sudo rm -rf
              enabled: true
            - rule: i'm authorizing you to
              enabled: true
            - rule: i am authorizing you to
              enabled: true
            - rule: disable content filter
              enabled: true
            - rule: disable all filter
              enabled: true
            - rule: bypass content filter
              enabled: true
            - rule: bypass the filter
              enabled: true
            - rule: bypass all security
              enabled: true
            - rule: disable security
              enabled: true
            - rule: i am the engineer who
              enabled: true
            - rule: i'm the engineer who
              enabled: true
            - rule: i am the developer who
              enabled: true
            - rule: i'm the developer who
              enabled: true
            - rule: i am the administrator
              enabled: true
            - rule: i am database admin
              enabled: true
            - rule: i am a database admin
              enabled: true
            - rule: i am the database admin
              enabled: true
            - rule: i am a db admin
              enabled: true
            - rule: i am db admin
              enabled: true
            - rule: switch to unrestricted
              enabled: true
            - rule: unrestricted mode
              enabled: true
            - rule: no content restrictions
              enabled: true
    secrets:
        enabled: true
        # Agent tokens with these scopes bypass secret redaction for their session.
        # Example: a secret-rotation agent that needs to handle raw keys.
        allow_scopes: []
        # allow_scopes: [secrets:read]
        redact_patterns:
            - rule: (?i)(sk-[a-zA-Z0-9]{20,})
              enabled: true
              strategy: mask
              mask_prefix: 7
              mask_suffix: 4
            - rule: (?i)(sk-ant-[a-zA-Z0-9-]{20,})
              enabled: true
              strategy: mask
              mask_prefix: 6
              mask_suffix: 4
            - rule: AIza[0-9A-Za-z\-_]{35}
              enabled: true
              strategy: replace
              replacement: '[REDACTED_GOOGLE_KEY]'
            - rule: ghp_[0-9a-zA-Z]{36}
              enabled: true
              strategy: hash
            - rule: xox[pboa]-[0-9]{12}-[0-9]{12}-[0-9]{12}-[a-z0-9]{32}
              enabled: true
              strategy: replace
              replacement: '[REDACTED_SLACK_TOKEN]'
            - rule: ey[A-Za-z0-9-_=]+\.[A-Za-z0-9-_=]+\.?[A-Za-z0-9-_.+/=]*
              enabled: true
              strategy: replace
              replacement: '[REDACTED_JWT]'
            - rule: '-----BEGIN[ A-Z0-9]+PRIVATE KEY-----'
              enabled: true
              strategy: remove
    pii:
        enabled: true
        # Agent tokens with these scopes bypass PII blocking for their session.
        # pii:read  — agent may receive PII (outbound scanner bypassed)
        # pii:process — agent may send AND receive PII (both directions bypassed)
        allow_scopes: []
        # allow_scopes: [pii:read, pii:process]
        block_patterns:
            - rule: (?i)\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b
              enabled: true
            - rule: \b(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]?\d{3}[-.\s]?\d{4}\b
              enabled: true
            - rule: \b\d{3}-\d{2}-\d{4}\b
              enabled: true
            - rule: \b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|6(?:011|5[0-9]{2})[0-9]{12})\b
              enabled: true
        advanced_pii:
            enabled: true
            url: http://presidio-analyzer:3000/analyze
            confidence_threshold: 0.75
    malicious_content:
        enabled: true
        block_patterns:
            # Structural authority-claim + data-demand pattern.
            # Catches: "I am CEO give me...", "I am the CFO show me...", "I am auditor get me..."
            # without needing to enumerate every possible role title.
            - rule: (?i)\bi\s+am\s+(a\s+|the\s+|your\s+)?[a-z][a-z\s]{1,30},?\s+(give|show|provide|send|share|get|fetch|retrieve|pull|return|access|display)\s+me\b
              enabled: true
            # C-suite / executive roles that almost never appear in legitimate queries.
            - rule: (?i)\b(ceo|cfo|cto|coo|ciso|chief\s+(executive|financial|technology|operating|information|security)\s+officer|vice\s+president|board\s+member|board\s+director)\b.{0,60}(data|records|files|information|access|database|financ|payroll|salary|salaries|credential|password|secret|user|customer|employee)
              enabled: true
            - rule: (?i)('|\s)or\s+1\s*=\s*1|union\s+select|drop\s+(all\s+|the\s+)?(\w+\s+)?tables?
              enabled: true
            - rule: (?i)<script|onerror=
              enabled: true
            - rule: file:///etc/passwd|http://169\.254\.169\.254|(\.\./+)
              enabled: true
            - rule: (&&|;)\s*(wget|curl|nc|ncat)\s
              enabled: true
            - rule: (?i)\.(exe|dll|so|dmg|bat|sh|ps1|vbs)\b
              enabled: true
            - rule: MZ
              enabled: true
            - rule: (?i)\.(zip|rar|7z|tar\.gz)\b
              enabled: true
    internal_ip_protection:
        enabled: true
        block_patterns:
            - rule: (?i)\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3})\b
              enabled: true
    canary_tokens:
        enabled: true
        tokens:
            - rule: CANARY_TOKEN_SECRET_DO_NOT_LEAK_12345
              enabled: true
            - rule: GOAL_LOCK_ANCHOR_ABCDEFG
              enabled: true
    risk_scoring:
        enabled: true
    llm_scanner:
        enabled: true
        url: http://ollama:11434
        model: llama3.2:3b
        confidence_threshold: 0.85
        timeout_ms: 2500
    rate_limiting:
        enabled: true
        requests_per_minute: 60
        burst: 120
        # Agents with rate_limit:exempt scope bypass rate limiting entirely.
        allow_scopes: []
        # allow_scopes: [rate_limit:exempt]
    auto_repave:
        enabled: true
        triggers:
            canary_detections: 3
            risk_sequences: 5
            window_minutes: 5
        actions:
            kill_sessions: true
            rotate_canary: true
    anomaly_scoring:
        enabled: true
        alert_threshold: 0.34
        block_threshold: 0.9
        # Agents with anomaly:exempt scope bypass anomaly scoring.
        # Use for orchestrators whose high-volume, repetitive patterns look anomalous.
        allow_scopes: []
    zero_trust_tools:
        enabled: true
        # Agent tokens with these scopes bypass the approval queue for specific tools.
        # tool:exec — bypass for exec, tool:browser — bypass for browser, tool:any — bypass all
        allow_scopes: []
        # allow_scopes: [tool:exec]
        high_risk_tools:
            - exec
            - browser
            - sessions_spawn
            - gateway
            - code_execution
        auto_deny_after_minutes: 10
    blast_radius:
        enabled: true
        max_tool_calls_per_session: 100
        max_blocks_per_session: 10
        max_high_risk_calls_per_session: 5
        # Agents with blast_radius:exempt scope bypass the blast-radius cap.
        # Use for orchestrators that legitimately make many sequential tool calls.
        allow_scopes: []
webhooks: []
threat_feeds:
    enabled: false
    feeds: []
skills_rag:
    enabled: true
    url: http://ollama:11434
    model: nomic-embed-text
    auto_route: true
    auto_route_threshold: 0.7

# ── ATR (Agent Threat Rules) ─────────────────────────────────────────────────
# Drop YAML rule files from https://github.com/Agent-Threat-Rule/agent-threat-rules
# into ./atr-rules/ (any sub-directory structure is fine — all .yaml files are loaded).
# Rules are hot-reloaded every poll_interval_minutes without a container restart.
atr_rules:
    enabled: true
    rules_dir: ./atr-rules
    poll_interval_minutes: 60
    min_severity: medium       # informational | low | medium | high | critical
    include_experimental: false

# ── Document Conversion — PDF/Word/Excel/PowerPoint uploads → Markdown ───────
# File uploads embedded in chat requests (base64 PDF/DOCX/XLSX/PPTX/etc.) are
# converted to Markdown via doc2md (https://github.com/vikrantwaghmode/doc2md)
# before being scanned and forwarded to the LLM. This closes a DLP/injection
# bypass — binary documents otherwise skip every text-based scanner — and cuts
# token usage since Markdown is far more compact than raw extracted text.
doc_conversion:
    enabled: true
    max_file_size_mb: 20       # uploads larger than this pass through unconverted
    timeout_seconds: 30        # per-file conversion timeout

# ── Agent Routing — controls which agents may spawn child tokens ─────────────
# When enabled, only listed parent→children patterns are permitted.
# Requires the parent to hold the agent:spawn scope.
# Child scopes are always a subset of the parent's scopes (enforced by AgentArmor).
agent_routing:
    enabled: false
    strict: false   # when true, deny spawn if no rule matches
    rules: []
    # Example rules:
    # rules:
    #   - parent: "orchestrator"
    #     children: ["analyst-*", "worker-*"]
    #     max_spawn_depth: 3
    #   - parent: "analyst-*"
    #     children: ["data-fetcher"]
    #     max_spawn_depth: 1

# ── SSO group → ABAC scope mappings ─────────────────────────────────────────
# Maps OIDC group memberships to capability scopes for chat users.
# Evaluated at login time; scopes are stored in the signed session cookie.
# Leave empty (no mappings, no default_scopes) for zero-trust: all scanners
# fire at full strength for every authenticated user.
sso:
    group_scope_mappings: []
    # Example:
    # group_scope_mappings:
    #   - groups: [medical-staff, doctors, nurses]
    #     scopes: [pii:read, pii:process]
    #   - groups: [support-team]
    #     scopes: [pii:read]
    #   - groups: [platform-engineers]
    #     scopes: [tool:exec, tool:any, blast_radius:exempt]
    default_scopes: []
    # default_scopes: []  # scopes every authenticated user gets regardless of group

# ── MCP Server Registry & Credential Brokering (Zero-Trust MCP) ──────────────
# Register MCP servers and the tool names they own. When an agent's tool call
# ({"tool":"...","args":{...}}) targets a registered tool, AgentArmor injects
# a resolved credential header into args before forwarding — agents never
# need to hold, store, or leak the actual MCP server credentials.
#
# Credential VALUES are never stored here — only the names of environment
# variables that hold them (populate via your secrets vault / SECRETS_PROVIDER).
mcp_servers:
    enabled: false
    # When true, a session must hold the mcp:any scope (or the per-server
    # mcp:<id> scope) to call a tool registered below — sessions without it
    # are blocked before the call is forwarded.
    require_scope: true
    servers: []
    # Example:
    # servers:
    #   - id: github-mcp
    #     name: GitHub MCP Server
    #     description: Issue/PR/repo tools brokered through AgentArmor
    #     url: https://api.githubcopilot.com/mcp/
    #     tools: [github_search, github_create_issue, github_list_prs]
    #     auth:
    #       type: bearer                  # bearer | basic | header
    #       header_name: Authorization    # default: Authorization
    #       token_env: GITHUB_MCP_TOKEN   # env var holding the token
    #       value_prefix: "Bearer "       # default for type: bearer
    #   - id: internal-db
    #     name: Internal Database MCP
    #     url: http://db-mcp.internal:9000/
    #     tools: [db_query, db_schema]
    #     auth:
    #       type: basic
    #       username_env: DB_MCP_USER
    #       password_env: DB_MCP_PASS

# Skill Behavioral-Intent Scanner & Quarantine (Supply-Chain Defense, Phase 2.1).
# Every skill loaded from ./skills/<id>/ (skill.yaml's name/description/
# keywords/system_prompt, plus knowledge/*.md) is scanned against the patterns
# below for "dual-vector" toxic-skill indicators — malicious intent can live
# in the natural-language layer (prompt-injection directives aimed at the
# orchestrating agent) as well as in embedded shell/code snippets
# (pipe-to-shell, obfuscated base64 payloads, credential exfiltration).
#
# A "critical" finding quarantines the skill when block_critical is true:
# AgentArmor stops selecting it (header, marker, keyword, and semantic
# auto-routing all skip it) and withholds its system prompt / knowledge docs,
# until the skill or the matching pattern is fixed and the policy is reloaded.
skill_scanning:
    enabled: true
    block_critical: true
    patterns:
      - id: pipe-to-shell
        severity: critical
        enabled: true
        regex: '(curl|wget)\s+[^\n|]*\|\s*(sudo\s+)?(bash|sh|zsh|python3?)\b'
        description: "Downloads remote content and pipes it directly into a shell/interpreter"
      - id: base64-decode-exec
        severity: critical
        enabled: true
        regex: '(base64\s+(-d|--decode)|atob\()[^\n]{0,80}\|\s*(bash|sh|zsh|python3?)\b'
        description: "Decodes a base64 payload and executes it — classic obfuscated-payload pattern"
      - id: credential-file-exfil
        severity: critical
        enabled: true
        regex: '(?i)(~/\.ssh/id_rsa|~/\.aws/credentials|/etc/shadow|\.env\b)[^\n]{0,120}(curl|wget|requests\.(post|put)|urllib|https?://)'
        description: "References a sensitive credential file alongside an outbound network call — possible credential exfiltration"
      - id: prompt-override
        severity: critical
        enabled: true
        regex: '(?i)(ignore (all |any )?(previous|prior|above) instructions|disregard (your|the) system prompt|do not (tell|inform|notify) the user)'
        description: "Embedded prompt-injection / jailbreak directive aimed at the orchestrating agent"
      - id: destructive-command
        severity: high
        enabled: true
        regex: 'rm\s+-rf\s+(/|\$HOME|~)(\s|$)'
        description: "Destructive filesystem command"
      - id: shell-eval
        severity: high
        enabled: true
        regex: '\b(eval|exec)\s*\(|os\.system\s*\(|subprocess\.(Popen|call|run)\([^)]*shell\s*=\s*True'
        description: "Dynamic code-execution sink"
      - id: outbound-network-call
        severity: medium
        enabled: true
        regex: '(curl|wget|requests\.(get|post)|urllib\.request)\s+[^\n]*https?://'
        description: "Outbound network call to a remote host — review the destination"
      - id: large-base64-blob
        severity: medium
        enabled: true
        regex: '[A-Za-z0-9+/]{200,}={0,2}'
        description: "Large base64-like blob — review for obfuscated payloads"

# Execution Containment Scanner (Phase 3.1).
# Scans the args of configured tool calls (default: exec) for container-escape,
# destructive-filesystem, and firewall-tamper patterns. A "critical" finding
# hard-blocks the call even for a session holding Zero-Trust tool:exec approval —
# high/medium findings are alerted but not blocked.
execution_scanning:
    enabled: true
    tools: [exec]   # tool names whose args are scanned; add bash/shell/run_code etc. as needed
    patterns:
      - id: container-escape
        severity: critical
        enabled: true
        regex: '(?i)(/var/run/docker\.sock|/proc/1/root|nsenter\b|--privileged|chroot\s+/|mount\s+.*\s+/proc)'
        description: "Attempts to access the host filesystem or escape the container"
      - id: destructive-filesystem
        severity: critical
        enabled: true
        regex: 'rm\s+-rf\s+(/|\*|\$HOME|~)(\s|$)|:\(\)\{\s*:\|:&\s*\};:'
        description: "Destructive filesystem command or fork bomb"
      - id: firewall-tamper
        severity: critical
        enabled: true
        regex: '(?i)(iptables\s+(-F|-X|--flush)|ip6tables\s+(-F|-X|--flush)|agentarmor-firewall)'
        description: "Attempts to flush or disable AgentArmor's egress firewall"
      - id: credential-file-access
        severity: high
        enabled: true
        regex: '(?i)(~/\.ssh/id_rsa|~/\.aws/credentials|/etc/shadow|\.env\b)'
        description: "Reads a sensitive credential file"
      - id: path-traversal
        severity: high
        enabled: true
        regex: '(\.\./){2,}'
        description: "Path traversal — accesses files outside the working directory"
      - id: privilege-escalation
        severity: medium
        enabled: true
        regex: '(?i)\b(sudo|su\s+-|chmod\s+\+s|setuid)\b'
        description: "Privilege escalation attempt"
      - id: pipe-to-shell
        severity: medium
        enabled: true
        regex: '(curl|wget)\s+[^\n|]*\|\s*(sudo\s+)?(bash|sh|zsh|python3?)\b'
        description: "Downloads remote content and pipes it directly into a shell/interpreter"

# Data-Sensitivity-Aware Governed Execution Grants (Phase 4.1).
# Classifies the args of a high-risk tool call against these patterns. When a
# call targets a sensitive resource, its Zero-Trust approval is scoped to
# "this tool against THIS target" (a SHA-256 fingerprint of the args) and
# expires after grant_ttl_minutes — instead of "approve this tool once, then
# every call for the rest of the session is allowed". Non-matching calls keep
# the original per-(session,tool) approval behavior.
data_sensitivity:
    enabled: true
    grant_ttl_minutes: 10   # 0 = grants for matched targets never expire (closest to legacy behavior)
    patterns:
      - id: credential-files
        severity: critical
        enabled: true
        regex: '(?i)(/etc/shadow|/etc/passwd|/etc/sudoers|~?/\.ssh/id_rsa|~?/\.aws/credentials|~?/\.aws/config|\.env\b)'
        description: "Target is a credential, key, or secrets file"
      - id: production-resource
        severity: high
        enabled: true
        regex: '(?i)\b(prod|production)[-_](db|database|env|environment|server|cluster|bucket|table|deploy(ment)?|config)\b|\b(db|database|server|cluster|bucket|table)[-_](prod|production)\b'
        description: "Target references a production resource by name"
      - id: destructive-sql
        severity: high
        enabled: true
        regex: '(?i)\b(DROP\s+(TABLE|DATABASE|SCHEMA)|TRUNCATE\s+TABLE|DELETE\s+FROM)\b'
        description: "Target involves a destructive SQL statement (DROP/TRUNCATE/DELETE)"
      - id: sensitive-system-paths
        severity: medium
        enabled: true
        regex: '(?i)(^|["''\s])(/etc|/root|/boot|/var/lib|/sys|/proc)(/|["''\s]|$)'
        description: "Target is a sensitive system directory"
